<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tech task mockups</title>
  <link rel="stylesheet" href="../../../field-app/src/index.css" />
  <style>
    body.c04-on { margin: 0; }
    .mock-flag { margin: 0 0 8px; padding: 6px 10px; background: #fff; border: 1px dashed #00689C; border-radius: 8px; color: #00689C; font-size: 13px; font-weight: 700; }
    .mock-hint { margin: 0 0 12px; color: #3A4E5C; font-size: 16px; }
    .mock-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .mock-sync { display: inline-flex; align-items: center; gap: 6px; color: #3A4E5C; font-size: 13px; font-weight: 700; }
    .mock-dot { width: 10px; height: 10px; border-radius: 50%; background: #1F7A32; }
    .mock-person { width: 36px; height: 36px; border-radius: 50%; border: 1px solid #B7C9D4; background: #fff; color: #142C3C; font-weight: 700; }
    .mock-sheet { position: sticky; bottom: 0; margin: 12px -16px -32px; padding: 12px 16px 24px; background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -8px 24px rgba(20,44,60,.12); }
    .mock-menu { background: #fff; border-radius: 14px; padding: 8px 0; }
    .mock-menu p, .mock-menu a, .mock-menu button { display: block; width: 100%; margin: 0; padding: 12px 14px; text-align: left; background: transparent; border: 0; border-bottom: 1px solid #D5E3EA; color: #142C3C; font: inherit; font-weight: 700; }
  </style>
</head>
<body class="c04-on">
  <div class="app-shell c04">
    <div class="screen" id="page"></div>
  </div>
  <script>
    const pages = {
      start: `
        <div class="mock-bar"><span class="mock-sync"><span class="mock-dot"></span>Saved</span><button class="mock-person" type="button" aria-label="Account">A</button></div>
        <p class="mock-flag">MOCKUP — sample route, not a live screen</p>
        <h1>Start my day</h1>
        <p class="mock-hint">Today's doors, in the order your manager set.</p>
        <section class="c04-band-green">
          <p class="c04-eyebrow">Next stop · 8:00–10:00</p>
          <h2>SYNTHETIC Facility A</h2>
          <p>3 doors · 1 done · 2 left</p>
        </section>
        <button class="btn c04-btn-blue" type="button">Open next stop in Maps</button>
        <p class="mock-hint">No route today? Pick a site instead.</p>`,
      inspect: `
        <div class="mock-bar"><button class="btn c04-back" type="button">Back</button><span class="mock-sync"><span class="mock-dot"></span>Saved</span><button class="mock-person" type="button" aria-label="Account">A</button></div>
        <p class="mock-flag">MOCKUP — sample door, not a live inspection</p>
        <h1>Inspect this door</h1>
        <p class="mock-hint">Door 510A · last result Passed, Nov 12.</p>
        <section class="c04-band">
          <p><strong>Labels</strong> — in place and readable</p>
          <p>Pass</p>
          <p><strong>Holes or breaks</strong></p>
          <p>Not answered</p>
        </section>
        <button class="btn c04-btn-blue" type="button">Save</button>
        <p class="mock-hint">Problem found? Fix this door. You come back here.</p>
        <button class="btn c04-choice" type="button">Details</button>`,
      fix: `
        <div class="mock-bar"><button class="btn c04-back" type="button">Back</button><span class="mock-sync"><span class="mock-dot"></span>Saved</span><button class="mock-person" type="button" aria-label="Account">A</button></div>
        <p class="mock-flag">MOCKUP — sample service note, not saved</p>
        <h1>Fix this door</h1>
        <p class="mock-hint">Door 610A · inspection stays put.</p>
        <section class="c04-band-green">
          <label for="did">What you did</label>
          <textarea id="did" readonly>Tightened the closer. Door latches.</textarea>
        </section>
        <button class="btn c04-btn-blue" type="button">Save</button>
        <button class="btn c04-choice" type="button">Details</button>`,
      finish: `
        <div class="mock-bar"><button class="btn c04-back" type="button">Back</button><span class="mock-sync"><span class="mock-dot"></span>Saved</span><button class="mock-person" type="button" aria-label="Account">A</button></div>
        <p class="mock-flag">MOCKUP — sample visit, report not sent</p>
        <h1>Finish the visit</h1>
        <p class="mock-hint">Today's doors. Nothing is emailed until you send.</p>
        <ul class="c04-openings">
          <li><div class="c04-opening"><span><strong>510A</strong><span class="c04-result-passed">Passed</span></span></div></li>
          <li><div class="c04-opening"><span><strong>610A</strong><span class="c04-result-passed">Passed</span></span></div></li>
          <li><div class="c04-opening"><span><strong>710A</strong><span class="c04-result-failed">Failed</span></span></div></li>
        </ul>
        <button class="btn c04-btn-blue" type="button">Send one report</button>`,
      details: `
        <div class="mock-bar"><button class="btn c04-back" type="button">Back</button><span class="mock-sync"><span class="mock-dot"></span>Saved</span></div>
        <p class="mock-flag">MOCKUP — Details drawer on Inspect this door</p>
        <h1>Door 510A</h1>
        <p class="mock-hint">The inspection stays on screen behind this list.</p>
        <div class="mock-sheet" role="dialog" aria-label="Details">
          <h2>Details</h2>
          <button class="btn c04-choice" type="button">History</button>
          <button class="btn c04-choice" type="button">Schedules</button>
          <button class="btn c04-choice" type="button">Hardware</button>
          <button class="btn c04-choice" type="button">Door and frame</button>
          <button class="btn c04-choice" type="button">Request service</button>
        </div>`,
      account: `
        <div class="mock-bar"><button class="btn c04-back" type="button">Back</button><span class="mock-sync"><span class="mock-dot" style="background:#E0A72E"></span>1 waiting</span><button class="mock-person" type="button" aria-label="Account">A</button></div>
        <p class="mock-flag">MOCKUP — account menu, not a live account</p>
        <h1>Account</h1>
        <div class="mock-menu">
          <p>Signed in as tech@example.invalid</p>
          <p>OI Synthetic Acceptance A</p>
          <button type="button">Synchronization review</button>
          <button type="button">Company</button>
          <button type="button">Change password</button>
          <button type="button">How to use</button>
          <button type="button">Sign out</button>
          <p>Build sample</p>
        </div>`
    };
    const name = new URLSearchParams(location.search).get("page") || "start";
    document.body.classList.add("c04-on");
    document.getElementById("page").innerHTML = pages[name] || pages.start;
  </script>
</body>
</html>
