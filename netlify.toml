[build]
  command = "npm run build"
  publish = "netlify/public"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express"]

[context.production.environment]
  NODE_ENV = "production"

# Isolated, protected staging only; production settings above are unchanged.
[context."pr2-staging"]
  command = "node scripts/build-protected-staging.mjs"
  publish = "dist/protected-staging"

[context."pr2-staging".environment]
  NPM_FLAGS = "--include=dev"
