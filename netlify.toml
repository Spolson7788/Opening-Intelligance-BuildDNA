[build]
  command = "node scripts/build-isolated-release.mjs"
  publish = "dist/isolated-release"
[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--include=dev"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "sharp", "tesseract.js", "tesseract.js-core", "@tesseract.js-data/eng"]
  included_files = ["node_modules/tesseract.js/src/**", "node_modules/tesseract.js-core/**", "node_modules/@tesseract.js-data/eng/4.0.0_best_int/**"]
[context.production.environment]
  NODE_ENV = "production"
[[plugins]]
  package = "./plugins/function-evidence"
