[build]
  publish = "."
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Always revalidate the service worker and the app shells so a new deploy
# is picked up immediately instead of being served stale from cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/portal.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
