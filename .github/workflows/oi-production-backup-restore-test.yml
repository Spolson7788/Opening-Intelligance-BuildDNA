# SEC-1: Restore test into throwaway Postgres in CI (never production/staging).
name: OI production backup restore test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "synthetic (offline fixture) or r2 (download latest snapshot)"
        type: choice
        options:
          - synthetic
          - r2
        default: synthetic

permissions:
  contents: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oi_restore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client openssl awscli

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && exit 0
            sleep 1
          done
          exit 1

      - name: Run restore test
        env:
          SEC1_MODE: ${{ inputs.mode }}
          SEC1_TARGET_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oi_restore_test
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          OI_PROD_DATABASE_URL: ${{ secrets.OI_PROD_DATABASE_URL }}
        run: bash scripts/offsite-backup/restore-test.sh

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BACKUP_ALERT_TO: ${{ secrets.BACKUP_ALERT_TO }}
          BACKUP_ALERT_FROM: ${{ secrets.BACKUP_ALERT_FROM }}
          BACKUP_ALERT_SUBJECT: "OI backup restore-test FAILED"
        run: bash scripts/offsite-backup/alert-failure.sh
